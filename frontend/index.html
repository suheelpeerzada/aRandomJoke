<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Joke App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Random Joke App</h1>

    <div class="card">
        <h2>Random Joke</h2>
        <p id="joke-area">Click the button to load a joke...</p>
        <button onclick="getRandomJoke()">Get Joke</button>
        <button onclick="saveJoke()">Save to Favorites</button>
    </div>

    <div class="card">
        <h2>Favourites</h2>
        <button onclick="loadFavourites()">Refresh List</button>
        <div id="fav-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
